:root {
  color-scheme: dark;
  --ink: #0E1424;
  --ink-2: #070A14;
  --panel: rgba(14, 20, 38, .84);
  --panel-2: rgba(24, 32, 58, .92);
  --line: rgba(233, 196, 106, .34);
  --line-2: rgba(233, 196, 106, .6);
  --gold: #E9C46A;
  --gold-2: #B8873B;
  --jade: #3FB6A8;
  --jade-2: #6FE0C8;
  --verm: #E0523F;
  --paper: #F4EAD5;
  --muted: #98A2B8;
  --c1: #A9B3BD; --c2: #44C47C; --c3: #3F92F2; --c4: #B862F2; --c5: #F4B63C;
  --brush: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
  --ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
  --num: "Barlow Condensed", "PingFang SC", "Microsoft YaHei", sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ink-2); overflow: hidden; }
body { font-family: var(--ui); color: var(--paper); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
#app { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); background: radial-gradient(ellipse at 50% 40%, #16213C, var(--ink-2)); overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: var(--ink); }
#stage.P { width: 720px; height: 1280px; }
#cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font-family: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
kbd { font-family: var(--num); }
.hud { position: absolute; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); }
.ph { font-size: 12px; letter-spacing: .12em; color: var(--muted); padding: 6px 10px 2px; }
.coin { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF3B8, #F2C14E 45%, #A8741E); box-shadow: 0 0 0 1px rgba(60,30,0,.5); vertical-align: -1px; margin-right: 3px; }
.coin.big { width: 22px; height: 22px; margin-right: 6px; vertical-align: -4px; }

/* ---------- 顶栏 ---------- */
#topbar { left: 12px; right: 12px; top: 8px; height: 48px; display: flex; align-items: center; gap: 14px; pointer-events: none; }
#topbar > * { pointer-events: auto; }
.tb-round { display: flex; align-items: baseline; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; min-width: 176px; }
.tb-round b { font-family: var(--num); font-size: 26px; font-weight: 700; color: var(--gold); letter-spacing: .02em; }
.tb-round span { font-size: 13px; color: var(--paper); }
#track { display: flex; align-items: center; gap: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
#track i { width: 18px; height: 18px; border-radius: 5px; background: #2A3350; display: grid; place-items: center; font-style: normal; font-size: 11px; font-family: var(--brush); color: #8A94AE; border: 1px solid rgba(255,255,255,.08); }
#track i.done { background: #1C2B30; color: #4F6A6A; }
#track i.win { background: #1F5A4E; color: #BFF5E6; }
#track i.lose { background: #5A2626; color: #FFC9C0; }
#track i.cur { outline: 2px solid var(--gold); color: var(--gold); background: #3A3320; }
#track i.pve { color: #FFB89A; }
.tb-timer { flex: 1; display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; min-width: 120px; }
#timerNum { font-family: var(--num); font-size: 24px; font-weight: 700; width: 30px; text-align: right; }
.tbar { flex: 1; height: 8px; background: #1E2640; border-radius: 4px; overflow: hidden; }
.tbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--jade), var(--gold)); border-radius: 4px; }
.tb-btns { display: flex; gap: 6px; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-family: var(--brush); font-size: 20px; color: var(--paper); display: grid; place-items: center; transition: background .15s; }
.icon-btn:hover { background: var(--panel-2); border-color: var(--line-2); }
.icon-btn.off { color: #5A6480; text-decoration: line-through; }
#btnSpeed { font-family: var(--num); font-size: 18px; font-weight: 700; }
.btn-ready { height: 40px; padding: 0 18px; border-radius: 10px; background: linear-gradient(180deg, #F4D27A, #C48A2E); color: #2A1A08; font-family: var(--brush); font-size: 22px; box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 4px 12px rgba(233,196,106,.25); }
.btn-ready:hover { filter: brightness(1.08); }
.btn-ready[disabled] { filter: grayscale(.9) brightness(.6); cursor: default; }

/* ---------- 羁绊 ---------- */
#traits { left: 12px; top: 66px; width: 200px; height: 396px; overflow-y: auto; padding: 4px 0; scrollbar-width: thin; }
.trait { display: flex; align-items: center; gap: 8px; padding: 5px 8px; cursor: default; border-radius: 8px; margin: 0 4px; }
.trait:hover { background: rgba(255,255,255,.05); }
.trait img { width: 34px; height: 34px; flex: none; }
.trait .tn { font-size: 14px; font-weight: 600; line-height: 1.1; }
.trait .tb { font-family: var(--num); font-size: 14px; color: var(--muted); letter-spacing: .02em; }
.trait .tb b { color: var(--paper); }
.trait .tb em { font-style: normal; color: var(--gold); font-weight: 700; }
.trait.off .tn { color: #8A93A8; font-weight: 500; }
.trait .cnt { margin-left: auto; font-family: var(--num); font-size: 20px; font-weight: 700; width: 26px; text-align: center; color: var(--paper); }
.trait.off .cnt { color: #6A7390; }
.traits-empty { padding: 14px 12px; font-size: 13px; color: var(--muted); line-height: 1.6; }
.dmg-row { padding: 5px 10px; display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: center; }
.dmg-row img { width: 30px; height: 30px; border-radius: 6px; }
.dmg-row .dn { font-size: 12px; display: flex; justify-content: space-between; }
.dmg-row .dn b { font-family: var(--num); font-size: 14px; }

/* ---------- 召唤师 ---------- */

.pl { display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: center; padding: 5px 10px; position: relative; transition: transform .3s; }
.pl img { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #3A4466; }
.pl.me img { border-color: var(--jade-2); }
.pl.opp { background: rgba(224,82,63,.14); }
.pl.opp::after { content: "对手"; position: absolute; right: 8px; top: 4px; font-size: 10px; background: var(--verm); color: #FFF; padding: 0 5px; border-radius: 4px; }
.pl .pn { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; gap: 4px; }
.pl .pn b { font-family: var(--num); font-size: 16px; font-weight: 700; }
.pl.me .pn span { color: var(--jade-2); font-weight: 700; }
.pl .phb { height: 6px; background: #1E2640; border-radius: 3px; overflow: hidden; margin-top: 3px; }
.pl .phb i { display: block; height: 100%; background: linear-gradient(90deg, #3FB6A8, #58D68D); transition: width .5s; }
.pl.low .phb i { background: linear-gradient(90deg, #E0523F, #F4B63C); }
.pl.dead { opacity: .45; filter: grayscale(1); }
.pl.dead .pn b::before { content: "第" ; font-size: 11px; }
.pl .pl-lv { position: absolute; left: 34px; top: 30px; font-family: var(--num); font-size: 11px; background: #1E2640; border: 1px solid #3A4466; border-radius: 6px; padding: 0 3px; line-height: 13px; }
.wave { display: flex; align-items: center; gap: 8px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.wave i { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-style: normal; font-family: var(--brush); background: #222B46; color: #8A94AE; font-size: 13px; flex: none; }
.wave.done i { background: #1F5A4E; color: #BFF5E6; }
.wave.cur { color: var(--paper); }
.wave.cur i { outline: 2px solid var(--gold); color: var(--gold); }
.wave.boss i { color: #FFB89A; }

/* ---------- 装备 ---------- */
#itemTray { left: 12px; top: 470px; width: 200px; height: 112px; }
#items { display: grid; grid-template-columns: repeat(5, 34px); gap: 5px; padding: 4px 10px; }
#items img { width: 34px; height: 34px; border-radius: 7px; cursor: grab; touch-action: none; }
#items img:hover { filter: brightness(1.15); }
#items .empty { font-size: 12px; color: #6A7390; grid-column: 1 / -1; line-height: 1.5; padding-top: 4px; }
#itemGhost { position: fixed; width: 44px; height: 44px; pointer-events: none; z-index: 50; transform: translate(-50%, -50%); filter: drop-shadow(0 4px 8px rgba(0,0,0,.6)); border-radius: 8px; }
#augBar { right: 12px; top: 520px; width: 200px; height: 62px; display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
#augBar img { width: 44px; height: 44px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }

/* ---------- 商店 ---------- */
#shopbar { left: 12px; right: 12px; bottom: 8px; height: 124px; display: flex; gap: 10px; align-items: stretch; background: linear-gradient(180deg, rgba(20,26,48,.92), rgba(10,14,28,.96)); border: 1px solid var(--line); border-radius: 12px; padding: 8px; box-shadow: 0 -6px 24px rgba(0,0,0,.4); }
.sb-left { width: 208px; display: flex; flex-direction: column; gap: 5px; }
.lvl-row { display: flex; justify-content: space-between; align-items: baseline; }
#lvl { font-family: var(--num); font-size: 22px; font-weight: 700; color: var(--gold); }
#pop { font-size: 12px; color: var(--muted); }
#pop.warn { color: #FFB43A; }
#xpBar { position: relative; height: 12px; background: #1E2640; border-radius: 6px; overflow: hidden; }
#xpBar i { display: block; height: 100%; background: linear-gradient(90deg, #3F7FD6, #7FC8FF); transition: width .3s; }
#xpBar span { position: absolute; inset: 0; font-family: var(--num); font-size: 11px; text-align: center; line-height: 12px; }
.act-row { display: flex; gap: 6px; flex: 1; }
.act { flex: 1; border-radius: 9px; background: linear-gradient(180deg, #2A3A66, #1A2444); border: 1px solid #3F5288; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; transition: transform .08s, filter .15s; }
.act:hover { filter: brightness(1.15); }
.act:active { transform: translateY(1px); }
.act b { font-size: 14px; font-weight: 600; }
.act span { font-family: var(--num); font-size: 15px; font-weight: 700; }
.act span em { font-style: normal; }
.act kbd { position: absolute; top: 3px; right: 5px; font-size: 10px; color: #7A86A8; }
.act.poor { filter: grayscale(.8) brightness(.7); }
#btnRoll { background: linear-gradient(180deg, #2A5A5A, #173838); border-color: #3F8A7A; }
#shop { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.card { position: relative; border-radius: 9px; overflow: hidden; background: #111728; border: 2px solid var(--c1); display: flex; flex-direction: column; transition: transform .12s, box-shadow .12s; text-align: left; }
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,.4); }
.card .art { flex: 1; background-size: cover; background-position: center 18%; position: relative; min-height: 0; }
.card .tr { position: absolute; left: 4px; top: 4px; display: flex; flex-direction: column; gap: 2px; }
.card .tr span { font-size: 10px; background: rgba(10,8,20,.7); border-radius: 4px; padding: 1px 4px; display: flex; align-items: center; gap: 3px; }
.card .tr span i { font-style: normal; font-family: var(--brush); font-size: 12px; }
.card .foot { display: flex; justify-content: space-between; align-items: center; padding: 3px 7px; background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,.3)); font-size: 14px; font-weight: 600; }
.card .foot b { font-family: var(--num); font-size: 16px; }
.card.c1 { border-color: var(--c1); } .card.c2 { border-color: var(--c2); } .card.c3 { border-color: var(--c3); } .card.c4 { border-color: var(--c4); } .card.c5 { border-color: var(--c5); box-shadow: 0 0 12px rgba(244,182,60,.35); }
.card.own::after { content: attr(data-own); position: absolute; right: 4px; top: 4px; font-size: 11px; background: rgba(233,196,106,.92); color: #2A1A08; border-radius: 5px; padding: 0 5px; font-weight: 700; }
.card.up { animation: glow 1.1s ease-in-out infinite alternate; }
@keyframes glow { from { box-shadow: 0 0 4px rgba(233,196,106,.4); } to { box-shadow: 0 0 18px rgba(233,196,106,.9); } }
.card.sold { visibility: hidden; }
.card.poor .art { filter: grayscale(.7) brightness(.55); }
.card.flip { animation: flip .32s ease-out both; }
@keyframes flip { from { transform: rotateY(80deg); opacity: .2; } to { transform: none; opacity: 1; } }
.sb-right { width: 132px; display: flex; flex-direction: column; align-items: stretch; gap: 4px; position: relative; }
#gold { font-family: var(--num); font-size: 30px; font-weight: 700; color: #FFE08A; display: flex; align-items: center; justify-content: center; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
#streak { text-align: center; font-size: 12px; min-height: 16px; }
#streak.w { color: #FFB43A; } #streak.l { color: #8FC8FF; }
#btnLock { position: absolute; right: 0; top: 0; width: 30px; height: 30px; font-size: 15px; }
#btnLock.on { background: var(--gold-2); color: #1A1206; }
#odds { display: flex; justify-content: center; gap: 4px; font-family: var(--num); font-size: 12px; flex-wrap: wrap; }
#odds span { padding: 0 2px; }
#sellZone { position: absolute; inset: 0; border-radius: 12px; background: rgba(120,20,20,.82); border: 2px dashed #FF9A8A; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--brush); font-size: 30px; z-index: 5; }
#sellZone b { font-family: var(--num); color: #FFE08A; }
#sellZone.hot { background: rgba(170,30,30,.92); }

/* ---------- 浮层 ---------- */
#unitPanel { position: absolute; left: 222px; top: 66px; width: 272px; padding: 12px; z-index: 12; background: var(--panel-2); }
.up-head { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; }
.up-head img { width: 64px; height: 64px; border-radius: 10px; border: 2px solid var(--c1); }
.up-head h3 { margin: 0; font-family: var(--brush); font-size: 26px; font-weight: 400; line-height: 1.1; }
.up-head .sub { font-size: 12px; color: var(--muted); }
.up-stars { color: #FFD65A; letter-spacing: 2px; font-size: 14px; }
.up-traits { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.up-traits span { font-size: 12px; background: #222B46; border-radius: 5px; padding: 2px 7px; }
.up-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 8px; font-size: 12px; color: var(--muted); }
.up-stats b { color: var(--paper); font-family: var(--num); font-size: 14px; font-weight: 600; margin-left: 3px; }
.up-skill { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(233,196,106,.2); font-size: 12.5px; line-height: 1.6; color: #D8D2C4; }
.up-skill h4 { margin: 0 0 3px; font-size: 14px; color: var(--gold); display: flex; justify-content: space-between; }
.up-skill h4 small { color: #7FB8FF; font-family: var(--num); font-weight: 400; font-size: 12px; }
.up-skill em { font-style: normal; color: #FFE08A; font-weight: 600; }
.up-items { display: flex; gap: 6px; margin-top: 8px; }
.up-items div { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
.up-items img { width: 26px; height: 26px; border-radius: 5px; }
.up-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.up-foot button { font-size: 13px; padding: 5px 12px; border-radius: 7px; background: #5A2626; border: 1px solid #A04A3A; }
.up-foot button.alt { background: #223458; border-color: #3F5288; }
.up-close { position: absolute; right: 8px; top: 6px; font-size: 18px; color: var(--muted); width: 26px; height: 26px; }
#tooltip { position: absolute; z-index: 60; max-width: 270px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 9px; padding: 10px 12px; font-size: 12.5px; line-height: 1.6; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
#tooltip h4 { margin: 0 0 4px; font-size: 15px; color: var(--gold); }
#tooltip .tt-t { color: var(--muted); }
#tooltip .tt-t.on { color: var(--paper); }
#tooltip .tt-t.on b { color: var(--gold); }
#tooltip .rec { display: flex; align-items: center; gap: 4px; margin-top: 4px; color: var(--muted); }
#tooltip .rec img { width: 20px; height: 20px; border-radius: 4px; }
#toast { position: absolute; left: 50%; top: 62px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 55; pointer-events: none; }
#toast div { background: rgba(10,12,24,.9); border: 1px solid var(--line); border-radius: 20px; padding: 6px 16px; font-size: 14px; animation: toast 2.2s ease forwards; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }
#banner { position: absolute; left: 0; right: 0; top: 36%; text-align: center; pointer-events: none; z-index: 25; }
#banner .bn { display: inline-block; padding: 10px 70px; background: linear-gradient(90deg, transparent, rgba(8,10,20,.88) 20%, rgba(8,10,20,.88) 80%, transparent); animation: banner 2.2s ease forwards; }
#banner h2 { margin: 0; font-family: var(--brush); font-weight: 400; font-size: 64px; line-height: 1.1; color: var(--gold); text-shadow: 0 3px 0 #3A2408, 0 0 24px rgba(233,196,106,.45); }
#banner h2.lose { color: #FF8A7A; text-shadow: 0 3px 0 #3A0808, 0 0 24px rgba(224,82,63,.45); }
#banner h2.blue { color: #9FE3FF; text-shadow: 0 3px 0 #08203A, 0 0 24px rgba(159,227,255,.45); }
#banner p { margin: 2px 0 0; font-size: 16px; color: var(--paper); }
@keyframes banner { 0% { opacity: 0; transform: scale(1.3); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
#tip { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); z-index: 26; background: linear-gradient(180deg, #2A2412, #16120A); border: 1px solid var(--gold); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 14px; max-width: 560px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
#tip p { margin: 0; font-size: 14px; line-height: 1.6; }
#tip button { flex: none; background: var(--gold); color: #1A1206; font-weight: 700; border-radius: 8px; padding: 6px 12px; font-size: 13px; }

/* ---------- 弹窗 ---------- */
#modal { position: absolute; inset: 0; z-index: 45; display: flex; align-items: center; justify-content: center; background: rgba(4,6,14,.66); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
.mbox { background: linear-gradient(180deg, #19223F, #0F1528); border: 1px solid var(--line-2); border-radius: 16px; padding: 22px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.6); max-width: calc(100% - 40px); max-height: calc(100% - 40px); overflow: auto; position: relative; }
.mbox h2 { margin: 0 0 4px; font-family: var(--brush); font-weight: 400; font-size: 38px; color: var(--gold); text-align: center; line-height: 1.2; }
.mbox .msub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.augs { display: flex; gap: 16px; }
.aug { width: 220px; border-radius: 14px; padding: 18px 16px; background: linear-gradient(180deg, #232C4C, #151B31); border: 2px solid #C9D3DE; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; transition: transform .15s, box-shadow .15s; }
.aug:hover { transform: translateY(-5px); box-shadow: 0 12px 28px rgba(0,0,0,.5); }
.aug img { width: 88px; height: 88px; }
.aug .tier { font-size: 11px; letter-spacing: .2em; padding: 1px 8px; border-radius: 10px; background: rgba(255,255,255,.1); }
.aug h3 { margin: 0; font-family: var(--brush); font-weight: 400; font-size: 28px; }
.aug p { margin: 0; font-size: 13.5px; line-height: 1.6; color: #D8D2C4; min-height: 44px; }
.aug.t2 { border-color: #F2C14E; } .aug.t3 { border-color: #E98BFF; box-shadow: 0 0 20px rgba(233,139,255,.3); }
.mrow { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
.mbtn2 { padding: 9px 22px; border-radius: 10px; background: #223458; border: 1px solid #3F5288; font-size: 15px; }
.mbtn2.gold { background: linear-gradient(180deg, #F4D27A, #C48A2E); color: #2A1A08; border: 0; font-weight: 700; }
.mbtn2:hover { filter: brightness(1.12); }
.mbtn2[disabled] { opacity: .4; cursor: default; }
.ev { width: 440px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.ev img { width: 96px; height: 96px; }
.ev p { margin: 0; text-align: center; font-size: 15px; line-height: 1.7; color: #D8D2C4; }
.ev .opts { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 6px; }
.ev .opts button { padding: 11px 14px; border-radius: 10px; background: #1F2A4A; border: 1px solid #3F5288; font-size: 15px; text-align: center; }
.ev .opts button:hover { border-color: var(--gold); background: #28365E; }
.over { text-align: center; width: 560px; }
.over .place { font-family: var(--brush); font-size: 96px; line-height: 1; color: var(--gold); text-shadow: 0 4px 0 #3A2408, 0 0 40px rgba(233,196,106,.5); }
.over .place.low { color: #B8C4D8; text-shadow: 0 4px 0 #1A2030; }
.over .stats { display: flex; justify-content: center; gap: 28px; margin: 14px 0; }
.over .stats div { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); }
.over .stats b { font-family: var(--num); font-size: 26px; color: var(--paper); }
.lineup { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.lineup div { position: relative; }
.lineup img { width: 52px; height: 52px; border-radius: 8px; border: 2px solid var(--c1); }
.lineup span { position: absolute; bottom: -2px; left: 0; right: 0; text-align: center; font-size: 10px; color: #FFD65A; text-shadow: 0 1px 2px #000; }
.reward { color: #FFE08A; font-size: 15px; margin-top: 6px; }
.pause { width: 320px; display: flex; flex-direction: column; gap: 10px; }
.pause button { padding: 12px; border-radius: 10px; background: #223458; border: 1px solid #3F5288; font-size: 16px; }
.pause button.danger { background: #4A1E1E; border-color: #8A3A3A; }

/* 图鉴 */
.gal { width: 1080px; height: 600px; display: grid; grid-template-rows: auto auto 1fr; gap: 10px; }
.gal-tabs { display: flex; gap: 8px; justify-content: center; }
.gal-tabs button { padding: 6px 16px; border-radius: 16px; background: #1F2A4A; border: 1px solid #3F5288; font-size: 14px; }
.gal-tabs button.on { background: var(--gold); color: #1A1206; border-color: var(--gold); font-weight: 700; }
.gal-body { display: grid; grid-template-columns: 1fr 300px; gap: 14px; min-height: 0; }
.gal-grid { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; align-content: start; padding-right: 4px; }
.gh { border-radius: 9px; overflow: hidden; border: 2px solid var(--c1); background: #111728; text-align: center; }
.gh img { width: 100%; aspect-ratio: 1; display: block; }
.gh span { display: block; font-size: 13px; padding: 3px 0; }
.gh.on { outline: 2px solid var(--gold); outline-offset: 2px; }
.gal-detail { background: rgba(0,0,0,.25); border-radius: 12px; padding: 14px; overflow-y: auto; font-size: 13px; line-height: 1.7; }
.gal-detail .big { width: 100%; max-width: 100%; border-radius: 10px; }
.gal-detail h3 { margin: 6px 0 0; font-family: var(--brush); font-weight: 400; font-size: 30px; }
.tl { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; overflow-y: auto; align-content: start; }
.tl-card { display: grid; grid-template-columns: 48px 1fr; gap: 10px; background: rgba(0,0,0,.25); border-radius: 10px; padding: 10px; font-size: 12.5px; line-height: 1.6; }
.tl-card img { width: 48px; height: 48px; }
.tl-card h4 { margin: 0; font-size: 16px; color: var(--gold); }
.tl-card .mem { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; }
.tl-card .mem img { width: 26px; height: 26px; border-radius: 5px; }
.rec-grid { overflow: auto; }
.rec-grid table { border-collapse: separate; border-spacing: 4px; margin: 0 auto; }
.rec-grid td, .rec-grid th { width: 54px; height: 54px; text-align: center; vertical-align: middle; background: rgba(0,0,0,.2); border-radius: 8px; font-size: 10px; color: var(--muted); }
.rec-grid img { width: 38px; height: 38px; border-radius: 6px; display: block; margin: 0 auto 1px; }
.help { width: 760px; font-size: 14px; line-height: 1.8; color: #D8D2C4; }
.help h3 { color: var(--gold); margin: 14px 0 4px; font-size: 16px; }
.help p, .help ul { margin: 0; }
.help ul { padding-left: 20px; }
.help kbd { background: #223458; border: 1px solid #3F5288; border-radius: 4px; padding: 0 5px; font-size: 13px; }
.close-x { position: absolute; right: 12px; top: 10px; width: 32px; height: 32px; font-size: 22px; color: var(--muted); border-radius: 8px; }
.close-x:hover { background: rgba(255,255,255,.08); color: var(--paper); }

/* ---------- 主菜单 ---------- */
#menu { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 30%, rgba(14,20,36,.2), rgba(7,10,20,.72)); }
#menu[hidden] { display: none !important; }
#stage.menu-on .hud { display: none !important; }
#stage.menu-on #menu { background: radial-gradient(ellipse at 30% 40%, rgba(14,20,36,.35), rgba(7,10,20,.8)); }
.menu-inner { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto; gap: 18px 40px; width: 1120px; align-items: center; }
.logo { grid-column: 1; grid-row: 1; }
.logo h1 { margin: 0; font-family: var(--brush); font-weight: 400; font-size: 132px; line-height: 1; background: linear-gradient(180deg, #FFF3C4, #E9C46A 45%, #9A6A22); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 rgba(40,20,4,.8)) drop-shadow(0 0 30px rgba(233,196,106,.35)); letter-spacing: .04em; }
.logo-sub { display: block; font-size: 15px; letter-spacing: .5em; color: var(--jade-2); margin-bottom: 6px; }
.logo-tag { display: block; font-size: 16px; letter-spacing: .3em; color: var(--paper); margin-top: 6px; opacity: .85; }
#parade { grid-column: 1; grid-row: 2; display: flex; align-items: flex-end; gap: 0; height: 250px; }
#parade img { height: 100%; margin-right: -38px; filter: drop-shadow(0 10px 12px rgba(0,0,0,.5)); animation: bob 3s ease-in-out infinite; }
#parade img:nth-child(2) { height: 116%; animation-delay: -1s; z-index: 1; }

  /* ---------- 自动布阵 ---------- */
  function isRanged(hid) { const h = G.HEROES[hid] || G.MONSTERS[hid]; return h.range >= 2; }
  function isAssassin(hid) { const h = G.HEROES[hid]; return h && h.traits.indexOf('assassin') >= 0; }
  function freeCellFor(board, hid) {
    const taken = (c, r) => board.some(x => x.c === c && x.r === r);
    const rows = isAssassin(hid) ? [7, 6, 5, 4] : isRanged(hid) ? [7, 6, 5, 4] : [4, 5, 6, 7];
    const cols = isAssassin(hid) ? [0, 6, 1, 5, 2, 4, 3] : FRONT_COLS;
    for (const r of rows) for (const c of cols) if (!taken(c, r)) return [c, r];
    return null;
  }
  function autoPosition(units) {
    const b = [];
    const order = units.slice().sort((x, y) => (isRanged(x.hid) ? 1 : 0) - (isRanged(y.hid) ? 1 : 0));
    for (const u of order) { const cell = freeCellFor(b, u.hid); u.c = cell[0]; u.r = cell[1]; b.push(u); }
    return b;
  }
  G.autoPosition = autoPosition;
  function unitValue(u, p) {
    const h = G.HEROES[u.hid];
    let v = h.cost * Math.pow(3, u.star - 1) + u.items.length * 2;
    if (p && p.style) for (const t of h.traits) if (p.style.traits.indexOf(t) >= 0) v *= 1.35;
    return v;
  }
  function autoFill(p) {
    let moved = false;
    while (p.board.length < p.level) {
      const cands = p.bench.filter(Boolean).sort((a, b) => unitValue(b, p) - unitValue(a, p));
      if (!cands.length) break;
      const u = cands[0];
      const cell = freeCellFor(p.board, u.hid); if (!cell) break;
      p.bench[p.bench.indexOf(u)] = null; u.c = cell[0]; u.r = cell[1]; p.board.push(u);
      moved = true;
    }
    return moved;
  }

  /* ---------- 回合表 ---------- */
  function buildSchedule(mode) {
    const s = [];
    if (mode === 'pve') {
      const W = [
        { pve: 'w1' }, { pve: 'w2', aug: 1 }, { pve: 'golems' }, { pve: 'shadow', n: 4, star: 1, ev: 1 }, { pve: 'shadow', n: 5, star: 1.4 },
        { pve: 'tyrant', aug: 2 }, { pve: 'shadow', n: 6, star: 1.7 }, { pve: 'shadow', n: 6, star: 2, items: 1, ev: 1 },
        { pve: 'overlord', aug: 3 }, { pve: 'shadow', n: 7, star: 1.9, items: 1 }, { pve: 'shadow', n: 8, star: 2.1, items: 2, ev: 1 },
        { pve: 'storm', mult: 1.2, final: 1 }
      ];
      W.forEach((w, i) => s.push(Object.assign({ stage: Math.floor(i / 4) + 1, round: i % 4 + 1, label: '第 ' + (i + 1) + ' 关', wave: i + 1 }, w)));
      return s;
    }
    const st1 = [{ pve: 'w1' }, { pve: 'w2' }, { pve: 'w3' }, { pve: 'golems' }];
    st1.forEach((w, i) => s.push(Object.assign({ stage: 1, round: i + 1 }, w)));
    for (let st = 2; st <= 9; st++) {
      for (let r = 1; r <= 6; r++) {
        const e = { stage: st, round: r };
        if (r === 6) {
          e.pve = st === 2 ? 'tyrant' : st === 3 ? 'overlord' : 'storm';
          if (st > 4) e.mult = 1 + (st - 4) * 0.55;
        }
        if ((st === 2 && r === 1) || (st === 3 && r === 2) || (st === 4 && r === 2)) e.aug = st - 1;
        if (r === 4) e.ev = 1;
        s.push(e);
      }
    }
    s.forEach(e => { if (!e.label) e.label = e.stage + '-' + e.round; });
    return s;
  }

  /* ---------- 野怪阵容 ---------- */
  function monsterTeam(r) {
    const M = (hid, c, rr, extra) => Object.assign({ hid, star: 1, c, r: rr, items: [] }, extra || {});
    const mult = r.mult || 1;
    switch (r.pve) {
      case 'w1': return [M('minion', 2, 3), M('minion', 4, 3)];
      case 'w2': return [M('minion', 2, 3), M('minion', 4, 3), M('caster', 3, 1)];
      case 'w3': return [M('minion', 1, 3), M('minion', 3, 3), M('minion', 5, 3), M('caster', 2, 1), M('caster', 4, 1)];
      case 'golems': return [M('golem', 2, 3, { mult: 0.75 }), M('golemR', 4, 3, { mult: 0.75 }), M('caster', 3, 1)];
      case 'tyrant': return [M('tyrant', 3, 2, { mult }), M('minion', 1, 3), M('minion', 5, 3)];
      case 'overlord': return [M('overlord', 3, 2, { mult }), M('cannon', 1, 1), M('cannon', 5, 1), M('caster', 2, 1), M('caster', 4, 1)];
      case 'storm': return [M('storm', 3, 2, { mult }), M('dragonling', 1, 3, { mult }), M('dragonling', 5, 3, { mult })];
      case 'shadow': return shadowTeam(r);
    }
    return [];
  }
  function shadowTeam(r) {
    const style = pick(G.BOT_STYLES);
    const maxCost = Math.min(5, 1 + Math.floor(r.wave / 2.4));
    const pool = G.HERO_LIST.filter(h => h.cost <= maxCost);
    const pref = shuffle(pool.filter(h => h.traits.some(t => style.traits.indexOf(t) >= 0)));
    const rest = shuffle(pool.filter(h => pref.indexOf(h) < 0));
    const chosen = pref.concat(rest).slice(0, r.n);
    const units = chosen.map(h => {
      let star = Math.floor(r.star); if (Math.random() < r.star - star) star++;
      star = Math.max(1, Math.min(3, star));
      const items = [];
      for (let i = 0; i < (r.items || 0); i++) if (Math.random() < 0.6) items.push(pick(G.FULL_ITEMS));
      return { hid: h.id, star, items, shadow: true };
    });
    autoPosition(units);
    return units.map(u => Object.assign(u, { c: 6 - u.c, r: 7 - u.r }));
  }
  function lootFor(r, won) {
    const L = { gold: 0, comps: 0, full: 0, hero: 0 };
    switch (r.pve) {
      case 'w1': L.comps = 1; L.gold = 1; break;
      case 'w2': L.comps = 1; L.gold = 2; break;
      case 'w3': L.comps = 1; L.gold = 3; break;
      case 'golems': L.comps = 2; break;
      case 'tyrant': L.full = 1; L.gold = 3; break;
      case 'overlord': L.full = 1; L.hero = 4; break;
      case 'storm': L.full = 2; L.gold = 5; break;
      case 'shadow': L.comps = 1; L.gold = 2; break;
    }
    if (!won) { if (r.stage === 1) { L.gold = 1; } else { L.gold = 2; L.comps = 0; } L.full = 0; L.hero = 0; }
    return L;
  }
  function giveLoot(p, L, mul) {
    mul = mul || 1;
    p.gold += L.gold * mul;
    for (let i = 0; i < L.comps * mul; i++) p.items.push(pick(G.COMPONENTS));
    for (let i = 0; i < L.full * mul; i++) p.items.push(pick(G.FULL_ITEMS));
    if (L.hero) {
      const cands = G.HERO_LIST.filter(h => h.cost === L.hero && S.pool[h.id] > 0);
      if (cands.length) { const h = pick(cands); takeFromPool(h.id, 1); giveUnit(p, h.id, 1); }
    }
  }
  function giveUnit(p, hid, star) {
    const u = G.newUnit(hid, star);
    const i = p.bench.indexOf(null);
    if (i >= 0) p.bench[i] = u; else p.limbo.push(u);
    merge(p);
    // 若仍无处安放，按价出售
    for (const x of p.limbo.slice()) { removeUnit(p, x); p.gold += A.sellValue(x); returnUnitToPool(x); }
    return u;
  }

  /* ---------- 新对局 ---------- */
  G.newGame = function (mode) {
    initPool();
    UID = 1;
    S.mode = mode;
    S.schedule = buildSchedule(mode);
    S.ri = -1;
    S.speed = S.speed || 1;
    S.log = [];
    S.stats = { rounds: 0, dmgDealt: 0, maxStar: 1 };
    const me = newPlayer('你', true, pick(['houyi', 'diaochan', 'hanxin', 'libai', 'change', 'zhaoyun']), null);
    S.me = me;
    S.players = [me];
    if (mode === 'pvp') {
      const names = shuffle(G.BOT_NAMES.slice());
      const styles = shuffle(G.BOT_STYLES.slice());
      for (let i = 0; i < 7; i++) {
        const st = styles[i % styles.length];
        const av = pick(G.HERO_LIST.filter(h => st.traits.some(t => h.traits.indexOf(t) >= 0))).id;
        const b = newPlayer(names[i], false, av, st);
        b.skill = 0.75 + Math.random() * 0.5;
        S.players.push(b);
      }
    }
    for (const p of S.players) {
      p.gold = mode === 'pve' ? 4 : 2;
      const h1 = drawStarter();
      giveUnit(p, h1, 1);
      if (p.human) { const u = p.bench[0]; p.bench[0] = null; u.c = 3; u.r = 4; p.board.push(u); }
    }
    S.phase = 'planning';
    nextRound();
  };
  function drawStarter() {
    const cands = G.HERO_LIST.filter(h => h.cost === 1 && S.pool[h.id] > 0);
    const h = pick(cands); S.pool[h.id]--; return h.id;
  }

  /* ---------- 回合推进 ---------- */
  function nextRound() {
    S.ri++;
    if (S.ri >= S.schedule.length) {
      const last = S.schedule[S.schedule.length - 1];
      if (S.mode === 'pve') S.schedule.push(Object.assign({}, last, { label: '龙王再战', mult: (last.mult || 1) * 1.05, res: null }));
      else S.schedule.push(Object.assign({}, S.schedule[S.schedule.length - 6], { label: '加时', res: null }));
    }
    const R = S.round = S.schedule[S.ri];
    S.stats.rounds++;
    const first = S.ri === 0;
    for (const p of S.players) {
      if (!p.alive) continue;
      if (!first) {
        income(p);
        A.addXP(p, 2 + (p.augs.indexOf('xp') >= 0 ? 1 : 0));
      }
      if (!p.locked || !p.shop.length) rollShop(p);
      p.freeRolls = p.augs.indexOf('freeroll') >= 0 ? 1 : 0;
    }
    // 机器人回合
    for (const p of S.players) if (!p.human && p.alive) botTurn(p);
    // 匹配
    S.opp = null;
    if (!R.pve) matchmake();
    S.timer = S.timerMax = first ? 25 : R.pve ? 22 : 30;
    S.phase = 'planning';
    S.battle = null;
    S.pendingChoice = null;
    if (R.aug) {
      S.pendingChoice = 'aug';
      for (const p of S.players) if (!p.human && p.alive) applyAug(p, pick(augChoices(R.aug)).id);
      S.timer += 20; S.timerMax = S.timer;
      ui('openAugments', augChoices(R.aug), R.aug);
    } else if (R.ev) {
      S.pendingChoice = 'ev';
      ui('openEvent', pick(G.EVENTS));
    }
    sfx('gong');
    ui('roundStart', R);
    ui('refresh');
    if (first) ui('tip', 'start', '欢迎来到王者之弈！购买英雄、拖上棋盘，凑齐同职业或同阵营触发羁绊。');
    if (R.pve && R.stage === 2) ui('tip', 'boss', '野怪回合：击败暴君、主宰和风暴龙王可获得稀有装备。');
  }
  function income(p) {
    const R = S.round;
    let g = R.stage === 1 && S.mode === 'pvp' ? [2, 2, 3, 4][R.round - 1] || 4 : 5;
    if (S.mode === 'pve' && R.wave <= 2) g = 3;
    const cap = p.augs.indexOf('interest') >= 0 ? 8 : 5;
    const interest = Math.min(cap, Math.floor(p.gold / 10));
    const s = Math.abs(p.streak);
    const streakG = R.stage >= 2 || S.mode === 'pve' ? (s >= 5 ? 3 : s >= 4 ? 2 : s >= 2 ? 1 : 0) : 0;
    const sal = p.augs.indexOf('salary') >= 0 ? 2 : 0;
    p.gold += g + interest + streakG + sal;
    if (p.human) S.lastIncome = { base: g, interest, streak: streakG, sal };
  }
  function matchmake() {
    const alive = S.players.filter(p => p.alive);
    const me = S.me;
    const others = alive.filter(p => p !== me);
    shuffle(others);
    others.sort((a, b) => (me.recent.indexOf(a.id) >= 0 ? 1 : 0) - (me.recent.indexOf(b.id) >= 0 ? 1 : 0));
    S.opp = others[0] || null;
    if (S.opp) { me.recent.push(S.opp.id); if (me.recent.length > Math.min(3, others.length - 1)) me.recent.shift(); }
  }

  /* ---------- 奇遇 ---------- */
  function augChoices(tierHint) {
    const tier = tierHint === 1 ? (Math.random() < 0.7 ? 1 : 2) : tierHint === 2 ? (Math.random() < 0.75 ? 2 : Math.random() < 0.5 ? 1 : 3) : (Math.random() < 0.55 ? 2 : 3);
    const me = S.me;
    const pool = G.AUGMENTS.filter(a => a.tier === tier && me.augs.indexOf(a.id) < 0);
    return shuffle(pool.slice()).slice(0, 3);
  }
  G.augChoices = augChoices;
  function applyAug(p, id) {
    p.augs.push(id);
    const comp = () => pick(G.COMPONENTS), full = () => pick(G.FULL_ITEMS);
    switch (id) {
      case 'rich': p.gold += 10; break;
      case 'bigrich': p.gold += 22; break;
      case 'xp': A.addXP(p, 6); break;
      case 'items2': p.items.push(comp(), comp()); break;
      case 'itemFull': p.items.push(full()); break;
      case 'itemBox': p.items.push(full(), full()); break;
      case 'freeroll': p.freeRolls = Math.max(p.freeRolls, 1); break;
      case 'recruit3': for (let i = 0; i < 2; i++) { const c = G.HERO_LIST.filter(h => h.cost === 3 && S.pool[h.id] > 0); if (c.length) { const h = pick(c); takeFromPool(h.id, 1); giveUnit(p, h.id, 1); } } break;
      case 'recruit4': { const c = G.HERO_LIST.filter(h => h.cost === 4 && S.pool[h.id] >= 3); if (c.length) { const h = pick(c); takeFromPool(h.id, 3); giveUnit(p, h.id, 2); } break; }
      case 'starup': {
        const c = p.board.filter(u => u.star === 1);
        if (c.length) { const u = pick(c); takeFromPool(u.hid, 2); u.star = 2; if (p.human) ui('starUp', u); merge(p); }
        break;
      }
    }
  }
  G.chooseAug = function (id) {
    applyAug(S.me, id);
    S.pendingChoice = null;
    sfx('augment');
    ui('refresh');
  };
  G.rerollAugs = function (tier) { return augChoices(tier); };

  /* ---------- 奇遇事件 ---------- */
  G.resolveEvent = function (ev, opt) {
    const p = S.me; let msg = '';
    if (opt.cost && p.gold < opt.cost) { ui('toast', '金币不足'); sfx('error'); return false; }
    if (opt.cost) p.gold -= opt.cost;
    switch (opt.fx) {
      case 'comp': { const it = pick(G.COMPONENTS); p.items.push(it); msg = '获得 ' + G.ITEMS[it].name; break; }
      case 'full': { const it = pick(G.FULL_ITEMS); p.items.push(it); msg = '获得 ' + G.ITEMS[it].name; break; }
      case 'bet1': if (Math.random() < 0.5) { p.gold += 12; msg = '赢了！获得 12 金币'; sfx('gold'); } else msg = '输了，5 金币打了水漂'; break;
      case 'bet2': if (Math.random() < 0.4) { p.gold += 28; msg = '大胜！获得 28 金币'; sfx('gold'); } else msg = '输了，10 金币打了水漂'; break;
      case 'hero': {
        const cost = Math.min(5, Math.max(1, Math.round(p.level / 2)));
        const c = G.HERO_LIST.filter(h => h.cost === cost && S.pool[h.id] > 0);
        if (c.length) { const h = pick(c); takeFromPool(h.id, 1); giveUnit(p, h.id, 1); msg = h.name + ' 加入了你的队伍'; }
        break;
      }
      case 'gold3': p.gold += 3; msg = '获得 3 金币'; break;
      case 'gold4': p.gold += 4; msg = '获得 4 金币'; break;
      case 'gold5': p.gold += 5; msg = '获得 5 金币'; break;
      case 'heal10': p.hp = Math.min(100, p.hp + 10); msg = '回复 10 生命'; break;
      case 'relic': { p.hp -= 8; const it = pick(G.FULL_ITEMS); p.items.push(it); msg = '失去 8 生命，获得 ' + G.ITEMS[it].name; if (p.hp <= 0) p.hp = 1; break; }
      case 'xp8': A.addXP(p, 8); msg = '获得 8 经验'; break;
      case 'pact': p.hp -= 10; p.gold += 15; if (p.hp <= 0) p.hp = 1; msg = '失去 10 生命，获得 15 金币'; break;
      case 'chest': {
        const r = Math.random();
        if (r < 0.35) { p.gold += 8; msg = '宝箱里有 8 金币'; }
        else if (r < 0.7) { const it = pick(G.COMPONENTS), it2 = pick(G.COMPONENTS); p.items.push(it, it2); msg = '获得 ' + G.ITEMS[it].name + '、' + G.ITEMS[it2].name; }
        else { const it = pick(G.FULL_ITEMS); p.items.push(it); msg = '获得 ' + G.ITEMS[it].name; }
        break;
      }
      default: msg = '';
    }
    S.pendingChoice = null;
    if (msg) ui('toast', msg);
    ui('refresh');
    return true;
  };

  /* ---------- 机器人 ---------- */
  function botTargetLevel(p) {
    const R = S.round, st = R.stage, r = R.round;
    const t = st * 10 + r;
    let lv = t >= 56 ? 9 : t >= 46 ? 8 : t >= 42 ? 7 : t >= 33 ? 6 : t >= 25 ? 5 : t >= 21 ? 4 : t >= 13 ? 3 : 2;
    if (p.hp < 35 && lv < 8) lv++;
    return lv;
  }
  function botWants(p, hid) {
    const h = G.HEROES[hid];
    if (countCopies(p, hid, 1) + countCopies(p, hid, 2) > 0) return 3;
    if (h.traits.some(t => p.style.traits.indexOf(t) >= 0)) return 2;
    if (h.cost >= 4 && p.level >= 7) return 2;
    if (allUnits(p).length < p.level + 1) return 1;
    return 0;
  }
  function botBuyFromShop(p, reserve) {
    for (let i = 0; i < 5; i++) {
      const hid = p.shop[i]; if (!hid) continue;
      const w = botWants(p, hid);
      if (w <= 0) continue;
      const cost = G.HEROES[hid].cost;
      if (p.gold - cost < (w >= 3 ? Math.min(reserve, 10) : reserve)) continue;
      if (p.bench.indexOf(null) < 0 && countCopies(p, hid, 1) < 2) botSellWorst(p);
      A.buy(p, i);
    }
  }
  function botSellWorst(p) {
    const b = p.bench.filter(Boolean);
    if (!b.length) return;
    b.sort((x, y) => unitValue(x, p) - unitValue(y, p));
    A.sell(p, b[0]);
  }
  function botTurn(p) {
    const target = botTargetLevel(p);
    const econ = p.hp > 50 ? 30 : p.hp > 30 ? 10 : 0;
    while (p.level < target && p.gold >= 4 + Math.min(econ, 10) * 0.5) A.buyXP(p);
    botBuyFromShop(p, econ);
    let rolls = 0;
    while (rolls < 10 && (p.gold > econ + 30 || (p.hp < 35 && p.gold >= 6) || (S.round.stage >= 5 && p.gold >= 20))) {
      A.reroll(p); rolls++;
      botBuyFromShop(p, Math.min(econ, p.hp < 40 ? 0 : econ));
    }
    // 布阵：选价值最高的 level 个
    const all = allUnits(p).filter(u => p.limbo.indexOf(u) < 0);
    all.sort((a, b) => unitValue(b, p) - unitValue(a, p));
    const onBoard = all.slice(0, p.level);
    const rest = all.slice(p.level);
    p.board = autoPosition(onBoard);
    p.bench = new Array(G.BENCH).fill(null);
    rest.slice(0, G.BENCH).forEach((u, i) => { delete u.c; delete u.r; p.bench[i] = u; });
    for (const u of rest.slice(G.BENCH)) { p.gold += A.sellValue(u); returnUnitToPool(u); }
    // 装备
    const carries = p.board.slice().sort((a, b) => unitValue(b, p) - unitValue(a, p));
    let guard = 0;
    while (p.items.length && carries.length && guard++ < 20) {
      const u = carries.find(x => x.items.length < 3 || (x.items.some(i => G.ITEMS[i].comp) && G.ITEMS[p.items[0]].comp));
      if (!u) break;
      if (!A.equip(p, 0, u)) break;
    }
  }

  G._botTurn = botTurn;
  /* ---------- 开战 ---------- */
  function teamOf(p, mirror) {
    return {
      units: p.board.map(u => ({ hid: u.hid, star: u.star, items: u.items, c: mirror ? 6 - u.c : u.c, r: mirror ? 7 - u.r : u.r })),
      mods: { traits: G.calcTraits(p.board, p.augs), augs: p.augs, playerHp: p.hp }
    };
  }
  G.startCombat = function () {
    if (S.phase !== 'planning') return;
    const me = S.me;
    if (autoFill(me)) ui('toast', '已自动补齐棋盘英雄');
    S.pendingChoice = null;
    ui('closeModals');
    const R = S.round;
    let enemy;
    if (R.pve) enemy = { units: monsterTeam(R), mods: {} };
    else if (S.opp) enemy = teamOf(S.opp, true);
    else enemy = { units: [], mods: {} };
    enemy.mods.buff = G.difficulty().mul;
    S.battle = new G.Battle(teamOf(me, false), enemy);
    S.phase = 'combat';
    sfx('battle');
    ui('combatStart');
    ui('refresh');
  };

  function survivorsDamage(battle, team) {
    let d = 0;
    for (const u of battle.units) if (!u.dead && u.team === team) d += u.hero ? u.star : (u.mon && u.mon.boss ? 3 : 1);
    return d;
  }
  function stageDmg() { return S.mode === 'pve' ? 4 + Math.ceil(S.round.wave * 0.6) : G.STAGE_DMG[Math.min(S.round.stage, 9)]; }
  function applyStreak(p, won) { if (won) { p.streak = p.streak > 0 ? p.streak + 1 : 1; p.wins++; } else { p.streak = p.streak < 0 ? p.streak - 1 : -1; p.losses++; } }

  function resolveCombat() {
    const b = S.battle, R = S.round, me = S.me;
    const won = b.winner === 0;
    const res = { won, dmg: 0, loot: null, draw: b.winner === -1 };
    // 统计
    for (const u of b.units) if (u.team === 0) S.stats.dmgDealt += u.dealt;

  /* ---------- 氛围粒子 ---------- */

  }

      const p = ambient[i];
      p.x += (p.vx + Math.sin(time + p.ph) * 8) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;

  /* ---------- 单位绘制 ---------- */

    if (res.loot && (res.loot.gold || res.loot.comps || res.loot.full || res.loot.hero)) {
      const L = res.loot, parts = [];
      if (L.gold) parts.push(L.gold + ' 金币'); if (L.comps) parts.push(L.comps + ' 件基础装备'); if (L.full) parts.push(L.full + ' 件成品装备'); if (L.hero) parts.push('1 位四费英雄');
      sub = '战利品：' + parts.join('、');
    }
    if (res.won) U.banner(R.pve ? '击破' : '胜利', sub || (res.oppDmg ? '对手损失 ' + res.oppDmg + ' 生命' : ''), '');
    else U.banner(res.draw ? '平局' : '失败', '-' + res.dmg + ' 生命' + (sub ? ' · ' + sub : ''), 'lose');
    R.res = res.won ? 'win' : 'lose';
    U.refresh();
  };
  U.starUp = function (u) {
    const h = G.HEROES[u.hid];
    U.toast('★'.repeat(u.star) + ' ' + h.name + ' 升至 ' + u.star + ' 星');
    const me = S.me;
    let p = null;
    if (me.board.indexOf(u) >= 0) p = G.render.cellXY(u.c, u.r); else { const i = me.bench.indexOf(u); if (i >= 0) p = G.render.benchXY(i); }
    if (p && G.render.burst) G.render.burst(p.x, p.y - 30, u.star === 3 ? '#FFD65A' : '#DDE6F0', u.star === 3 ? 60 : 30);
  };
  U.levelUp = function (lv) { U.toast('升到 ' + lv + ' 级！可上阵 ' + lv + ' 名英雄'); };
  U.gameOver = function (o) {
    const me = S.me;
    const place = o.place;
    const pve = o.mode === 'pve';
    const title = pve ? (o.pveClear ? '挑战成功' : '挑战失败') : '第' + '一二三四五六七八'[place - 1] + '名';
    const sub = pve ? (o.pveClear ? '风暴龙王已被击败，峡谷重归宁静' : '倒在了第 ' + S.round.wave + ' 关') : place === 1 ? '登顶王者！峡谷荣光由你守护' : place <= 4 ? '稳进前四，表现出色' : '胜败乃兵家常事，再来一局';
    const pts = pve ? (o.pveClear ? '获得 龙鳞 ×12、风暴精华 ×3' : '获得 龙鳞 ×' + Math.max(1, S.round.wave - 1)) : '王者积分 ' + ([0, 40, 30, 20, 10, -5, -10, -15, -20][place] >= 0 ? '+' : '') + [0, 40, 30, 20, 10, -5, -10, -15, -20][place];
    const lineup = me.board.concat(me.bench.filter(Boolean)).slice(0, 12);
    openModal('<div class="mbox over"><div class="place ' + ((pve ? !o.pveClear : place > 4) ? 'low' : '') + '">' + title + '</div><div class="msub" style="margin-top:8px">' + sub + '</div>'
      + '<div class="stats"><div><b>' + S.stats.rounds + '</b>存活回合</div><div><b>' + Math.round(S.stats.dmgDealt / 1000) + 'k</b>造成伤害</div><div><b>' + me.level + '</b>最终等级</div><div><b>' + '★'.repeat(S.stats.maxStar) + '</b>最高星级</div></div>'
      + '<div class="lineup">' + lineup.map(u => '<div><img alt="" src="' + A.portrait(u.hid, 52, 52) + '" style="border-color:' + G.COST_COLORS[G.HEROES[u.hid].cost] + '"><span>' + '★'.repeat(u.star) + '</span></div>').join('') + '</div>'
      + '<div class="reward">' + pts + '</div><div class="mrow"><button class="mbtn2 gold" id="oAgain">再来一局</button><button class="mbtn2" id="oHome">返回主页</button></div></div>', 'over');
    $('oAgain').onclick = () => startGame(o.mode);
    $('oHome').onclick = () => U.showMenu();
  };
})(window.G);

'use strict';
/* 王者之弈 · 启动与主循环 */
(function (G) {
  function ready() {
    const fontReady = document.fonts && document.fonts.load
      ? Promise.race([
          Promise.all([
            document.fonts.load('40px "Ma Shan Zheng"', '王者之弈战法猎刺辅长三稷城楚神金禄刷学商力泉疾暴甲龙财息贤兵先盾生血背斩将宝星王赌侠骸箱契训'),
            document.fonts.load('700 20px "Barlow Condensed"', '0123456789')
          ]),
          new Promise(r => setTimeout(r, 2500))
        ]).catch(() => {})
      : Promise.resolve();
    fontReady.then(start);
  }
  function start() {
    G.art.preload();
    G.render.init(document.getElementById('cv'));
    G.ui.init();
    const unlock = () => { G.audio.init(); window.removeEventListener('pointerdown', unlock); window.removeEventListener('keydown', unlock); };
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);
    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      try {
        if (!G.ui.isPaused()) G.tick(dt);
        G.render.frame(dt, G.view);
        G.ui.frame(dt);
      } catch (e) { console.error(e); }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    G.booted = true;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready); else ready();
})(window.G);

</script>
